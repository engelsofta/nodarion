    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#edcf94"/><stop offset="1" stop-color="#ad874a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#cfac69" stop-opacity=".16"/><stop offset="1" stop-color="#cfac69" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="28" fill="url(#surface)" stroke="#8e7954" stroke-opacity=".6"/>
  <ellipse cx="1060" cy="150" rx="200" ry="148" fill="url(#glow)"/>
