name: Pi-hole 6 disposable API test
on:
  push:
    branches: [codex/pihole6-api-test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIHOLE_TEST_PASSWORD: NodarionDisposableTestOnly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test HTTP client
        run: python -m pip install aiohttp voluptuous playwright
      - name: Start disposable Pi-hole (loopback only, no DHCP)
        run: |
          docker run -d --name nodarion-pihole-test \
            -e FTLCONF_webserver_api_password="$PIHOLE_TEST_PASSWORD" \
            -e FTLCONF_dns_listeningMode=all \
            -e FTLCONF_dns_upstreams=1.1.1.1 \
            -e FTLCONF_misc_etc_dnsmasq_d=true \
            -p 127.0.0.1:18080:80/tcp \
            -p 127.0.0.1:1053:53/udp \
            pihole/pihole:2026.10.1
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/info/login >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise real REST API through Nodarion's Pi-hole client
        run: python tests/pihole_live_check.py
      - name: Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Frontend regression tests
        run: node --test tests/*.cjs tests/*.mjs
      - name: Browser layout and interaction checks
        run: |
          python -m playwright install --with-deps chromium
          python -m http.server 18765 --bind 127.0.0.1 >/tmp/nodarion-preview.log 2>&1 &
          python tests/pihole_browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pihole-browser-previews
          path: test-artifacts
          if-no-files-found: ignore
      - name: Remove temporary Pi-hole
        if: always()
        run: docker rm -f nodarion-pihole-test || true
